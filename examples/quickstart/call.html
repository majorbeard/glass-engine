<!doctype html>
<!--
  Call quickstart: two people seeing and hearing each other through Glass.

  Serve the repository root (e.g. `npx serve .`) after `npm run build`, and
  open /examples/quickstart/call.html. "Start a call" makes a session of two
  members and joins with the first link; open the link it shows in another
  tab or device to join with the second. Making the session from the page
  only works against a local, token-less Glass; in a real app your backend
  makes it and mints the links (see docs/sources/calls.md).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glass call quickstart</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; max-width: 960px; }
    .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
    video { width: 100%; background: #000; border-radius: 6px; }
    input { width: 100%; box-sizing: border-box; }
    #status { color: #555; }
  </style>
</head>
<body>
  <h1>Glass call</h1>
  <p><label>Glass server <input id="server" value="http://localhost:8080" /></label></p>
  <p><button id="start">Start a call</button> <span id="status"></span></p>
  <p id="share" hidden>Other person: <a id="link" target="_blank">join link</a></p>
  <div class="videos">
    <video id="local" autoplay playsinline muted></video>
    <video id="remote" autoplay playsinline></video>
  </div>

  <script type="module">
    import { GlassClient, createGlassSession, mintGlassLink } from "../../packages/client/dist/index.js";

    const $ = (id) => document.getElementById(id);
    const status = (text) => ($("status").textContent = text);
    const joinLink = new URLSearchParams(location.search).get("join");
    // Each member watches everything and publishes a camera and a microphone.
    const MEMBER = { watch: "all", publish: ["camera", "microphone"] };

    async function joinCall(link) {
      const local = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      $("local").srcObject = local;
      const client = new GlassClient({ link });
      client.publish(local.getVideoTracks()[0], { kind: "camera" });
      client.publish(local.getAudioTracks()[0], { kind: "microphone" });
      // The other person's camera and microphone are two sources, each with
      // its own stream: one stream of both plays them in one <video>.
      const remote = new MediaStream();
      client.on("track", (_sourceId, stream) => {
        for (const t of stream.getTracks()) if (!remote.getTracks().includes(t)) remote.addTrack(t);
        $("remote").srcObject = remote;
      });
      client.on("connected", () => status("in the call"));
      client.on("reconnecting", (attempt, max) => status(`reconnecting ${attempt}/${max}`));
      client.on("closed", (reason) => status(`closed: ${reason}`));
      await client.connect();
    }

    if (joinLink) {
      $("start").hidden = true;
      $("server").closest("p").hidden = true;
      joinCall(joinLink).catch((err) => status(`failed: ${err.message}`));
    } else {
      $("start").onclick = async () => {
        $("start").disabled = true;
        const baseUrl = $("server").value.replace(/\/$/, "");
        // Your backend would do this with the API token.
        const session = await createGlassSession({ baseUrl, maxMembers: 2 });
        const mine = await mintGlassLink({ baseUrl, sessionId: session.id, rights: MEMBER });
        const theirs = await mintGlassLink({ baseUrl, sessionId: session.id, rights: MEMBER });
        $("link").href = `${location.pathname}?join=${encodeURIComponent(theirs.url)}`;
        $("share").hidden = false;
        await joinCall(mine.url).catch((err) => status(`failed: ${err.message}`));
      };
    }
  </script>
</body>
</html>
